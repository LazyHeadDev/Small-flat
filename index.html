  <!-- Asset URL Normalization & Global Error Diagnostics -->
  <script>
    // 1. Global asset resolver that safely resolves base path without rewriting browser URL or using regexes
    window.getAbsoluteAssetUrl = function(relativePath) {
      if (!relativePath) return '';
      var str = String(relativePath).trim();

      // Return immediately if already an absolute URL or data URI
      if (
        str.indexOf('http://') === 0 ||
        str.indexOf('https://') === 0 ||
        str.indexOf('//') === 0 ||
        str.indexOf('data:') === 0 ||
        str.indexOf('blob:') === 0
      ) {
        return str;
      }

      // Strip leading './' or '/'
      if (str.indexOf('./') === 0) {
        str = str.substring(2);
      } else if (str.indexOf('/') === 0) {
        str = str.substring(1);
      }

      // Determine the directory base of the current page
      var href = window.location.href.split('#')[0].split('?')[0];
      var lastSlash = href.lastIndexOf('/');
      var lastSegment = lastSlash >= 0 ? href.substring(lastSlash + 1) : href;

      var baseDir = '';
      if (lastSegment.indexOf('.') !== -1) {
        // Filename in path (e.g. /Tours/test2/index.html) -> base is /Tours/test2/
        baseDir = href.substring(0, lastSlash + 1);
      } else if (href.charAt(href.length - 1) === '/') {
        // Ends with slash (e.g. /Tours/test2/) -> base is /Tours/test2/
        baseDir = href;
      } else {
        // No trailing slash & no extension (e.g. /Tours/test2) -> base is /Tours/test2/
        baseDir = href + '/';
      }

      return baseDir + str;
    };

    // 2. Global HTML escape utility to safely render room titles and URLs
    window.escapeHtml = function(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    };

    // 3. Global error reporter to prevent silent failure or frozen loading state
    window.showViewerErrorUI = function(title, message, details) {
      console.error('[Virtual Tour Error]', title, message, details || '');
      var banner = document.getElementById('viewer-error-banner');
      if (banner) {
        banner.style.display = 'flex';
        var titleEl = document.getElementById('viewer-error-title');
        if (titleEl) titleEl.textContent = title || 'Virtual Tour Notice';
        var msgEl = document.getElementById('viewer-error-msg');
        if (msgEl) msgEl.textContent = message || 'An error occurred while loading the tour.';
        var detailsEl = document.getElementById('viewer-error-details');
        if (detailsEl) {
          if (details) {
            detailsEl.textContent = details;
            detailsEl.style.display = 'block';
          } else {
            detailsEl.style.display = 'none';
          }
        }
      }
      var overlay = document.getElementById('transition-overlay');
      if (overlay) overlay.classList.remove('active');
    };

    window.hideViewerErrorUI = function() {
      var banner = document.getElementById('viewer-error-banner');
      if (banner) banner.style.display = 'none';
    };

    window.addEventListener('error', function(e) {
      console.error('[Virtual Tour Window Error]', e.error || e.message || e);
      var msg = e.message || (e.target && e.target.src ? 'Failed to load script or asset: ' + e.target.src : 'Error initializing tour viewer');
      window.showViewerErrorUI('Initialization Error', msg, e.filename ? (e.filename + ':' + e.lineno) : undefined);
    });

    window.addEventListener('unhandledrejection', function(e) {
      console.error('[Virtual Tour Unhandled Rejection]', e.reason);
      var reasonMsg = (e.reason && (e.reason.message || e.reason.toString())) || 'Unhandled asynchronous error';
      window.showViewerErrorUI('Initialization Error', reasonMsg);
    });
  </script>

    const btnCloseDrawer = document.getElementById('btn-close-drawer');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const btnBrightness = document.getElementById('btn-brightness');
    const brightnessPopover = document.getElementById('brightness-popover');
    const exposureSlider = document.getElementById('exposure-slider');
    const exposureVal = document.getElementById('exposure-val');
    const btnResetExposure = document.getElementById('btn-reset-exposure');
    const btnRotate = document.getElementById('btn-rotate');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const compassNeedle = document.getElementById('compass-needle');
    const hotspotModal = document.getElementById('hotspot-modal');
    const hotspotModalTitle = document.getElementById('hotspot-modal-title');
    const hotspotModalDesc = document.getElementById('hotspot-modal-desc');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const transitionOverlay = document.getElementById('transition-overlay');
    const transitionText = document.getElementById('transition-text');
    const btnErrorRetry = document.getElementById('btn-error-retry');
    const btnErrorDismiss = document.getElementById('btn-error-dismiss');

    if (roomsBtnLabel) roomsBtnLabel.textContent = 'Rooms (' + tourData.scenes.length + ')';

    // 6. Three.js Scene, Camera, WebGLRenderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(config.fov, width / height, 0.1, 1100);

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(width, height);
      renderer.toneMapping = THREE.NoToneMapping;
      if (THREE.SRGBColorSpace) {
        renderer.outputColorSpace = THREE.SRGBColorSpace;
      }
      container.appendChild(renderer.domElement);
    } catch (webglErr) {
      console.error('[Virtual Tour] WebGLRenderer creation failed:', webglErr);
      window.showViewerErrorUI(
        'WebGL Not Available',
        'WebGL 3D graphics could not be initialized in your browser.',
        (webglErr.message || '') + '\n\nPlease verify that hardware acceleration is enabled in your browser settings.'
      );
      throw webglErr;
    }

    // 7. Inverted Sphere Mesh
    const sphereGeo = new THREE.SphereGeometry(500, 96, 64);
    sphereGeo.scale(-1, 1, 1);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.FrontSide });
    const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
    scene.add(sphereMesh);

    // 8. Hotspots Group
    const hotspotsGroup = new THREE.Group();
    scene.add(hotspotsGroup);
    const hotspotObjects = new Map();
    const pulsingMeshes = [];

    // Camera Orbit State
    let currentYaw = 0;
    let currentPitch = 0;
    let targetYaw = 0;
    let targetPitch = 0;
    let currentFov = config.fov;
    let targetFov = config.fov;

    let isPointerDown = false;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let previousPointerX = 0;
    let previousPointerY = 0;
    let pointerStartTime = 0;
    let isPinching = false;
    let touchStartDist = 0;
    let lastInteractionTime = Date.now();

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const textureLoader = new THREE.TextureLoader();
    const textureCache = new Map();

    function applyExposure() {
      const exp = Math.max(0.4, Math.min(2.2, config.exposure || 1.0));
      sphereMat.color.setRGB(exp, exp, exp);
      sphereMat.needsUpdate = true;
      if (exposureSlider) exposureSlider.value = exp;
      if (exposureVal) exposureVal.textContent = exp.toFixed(2) + 'x';
    }

    function createHotspotTexture(hs) {
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const center = size / 2;
      const color = hs.color || (hs.type === 'nav' ? '#10b981' : '#38bdf8');

      ctx.beginPath();
      ctx.arc(center, center, 44, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#ffffff';

      if (hs.type === 'nav') {
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(center - 14, center - 2);
        ctx.lineTo(center, center - 16);
        ctx.lineTo(center + 14, center - 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(center - 14, center + 12);
        ctx.lineTo(center, center - 2);
        ctx.lineTo(center + 14, center + 12);
        ctx.stroke();
      } else {
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('i', center, center);
      }

      const tex = new THREE.CanvasTexture(canvas);
      if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function renderHotspots(hotspots) {
      while (hotspotsGroup.children.length > 0) {
        hotspotsGroup.remove(hotspotsGroup.children[0]);
      }
      hotspotObjects.clear();
      pulsingMeshes.length = 0;

      if (!hotspots || !hotspots.length) return;

      hotspots.forEach((hs) => {
        const radius = 480;
        const phi = THREE.MathUtils.degToRad(90 - (hs.pitch || 0));
        const theta = THREE.MathUtils.degToRad((hs.yaw || 0) + 180);

        const x = radius * Math.sin(phi) * Math.cos(theta);
        const y = radius * Math.cos(phi);
        const z = radius * Math.sin(phi) * Math.sin(theta);

        const group = new THREE.Group();
        group.position.set(x, y, z);
        group.lookAt(0, 0, 0);

        const tex = createHotspotTexture(hs);
        const planeGeo = new THREE.PlaneGeometry(38, 38);
        const planeMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthTest: false, toneMapped: false });
        const planeMesh = new THREE.Mesh(planeGeo, planeMat);
        planeMesh.renderOrder = 999;
        group.add(planeMesh);

        if (hs.type === 'nav') {
          const ringGeo = new THREE.RingGeometry(22, 27, 32);
          const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthTest: false, toneMapped: false });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          ringMesh.renderOrder = 998;
          group.add(ringMesh);
          pulsingMeshes.push(ringMesh);
        }

        const hitGeo = new THREE.CircleGeometry(30, 16);
        const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthTest: false });
        const hitMesh = new THREE.Mesh(hitGeo, hitMat);
        hitMesh.renderOrder = 1000;
        group.add(hitMesh);

        hotspotsGroup.add(group);
        hotspotObjects.set(hitMesh, hs);
      });
    }

    /**
     * Robust texture loader with fallback for CORS cache collisions on shared hosting
     */
    function loadPanoramaTexture(sceneItem, onLoaded, onError) {
      const rawUrl = sceneItem.url;
      const resolvedUrl = window.getAbsoluteAssetUrl(rawUrl);
      let isDone = false;

      // 1. Try THREE.TextureLoader
      textureLoader.load(
        resolvedUrl,
        (tex) => {
          if (isDone) return;
          isDone = true;
          onLoaded(tex);
        },
        undefined,
        (loaderErr) => {
          console.warn('[Virtual Tour] TextureLoader error for:', resolvedUrl, 'Trying HTMLImageElement fallback...', loaderErr);
          
          // 2. Fallback: load directly via HTMLImageElement
          const img = new Image();
          const isCross = (resolvedUrl.indexOf('http://') === 0 || resolvedUrl.indexOf('https://') === 0 || resolvedUrl.indexOf('//') === 0) &&
            resolvedUrl.indexOf(window.location.origin) !== 0;
          if (isCross) {
            img.crossOrigin = 'anonymous';
          }
          img.onload = () => {
            if (isDone) return;
            isDone = true;
            try {
              const tex = new THREE.Texture(img);
              tex.needsUpdate = true;
              onLoaded(tex);
            } catch (canvasErr) {
              onError(canvasErr, resolvedUrl);
            }
          };
          img.onerror = (imgErr) => {
            if (isDone) return;
            isDone = true;
            console.error('[Virtual Tour] Fallback image load also failed for:', resolvedUrl, imgErr);
            onError(
              new Error('Could not load panorama image from "' + rawUrl + '". Please verify that the image exists at "' + resolvedUrl + '".'),
              resolvedUrl
            );
          };
          img.src = resolvedUrl;
        }
      );
    }

    function loadScene(sceneId, smoothTransition = true) {
      window.hideViewerErrorUI();
      const targetScene = tourData.scenes.find((s) => s.id === sceneId) || tourData.scenes[0];
      if (!targetScene) {
        window.showViewerErrorUI('Scene Not Found', 'Could not find requested scene ID: ' + sceneId);
        return;
      }

      currentSceneId = targetScene.id;
      if (currentSceneNameEl) currentSceneNameEl.textContent = targetScene.title || 'Scene';
      const idx = tourData.scenes.findIndex((s) => s.id === currentSceneId);
      if (sceneCounterEl) sceneCounterEl.textContent = 'Scene ' + (idx + 1) + ' of ' + tourData.scenes.length;

      updateRoomsDrawer();

      if (smoothTransition) {
        if (transitionText) transitionText.textContent = targetScene.title || 'Loading Scene...';
        if (transitionOverlay) transitionOverlay.classList.add('active');
      }

      const finishLoad = (texture) => {
        try {
          if (THREE.SRGBColorSpace) {
            texture.colorSpace = THREE.SRGBColorSpace;
          }
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          sphereMat.map = texture;
          sphereMat.needsUpdate = true;
          applyExposure();

          renderHotspots(targetScene.hotspots || []);

          if (targetScene.initialView) {
            targetYaw = targetScene.initialView.yaw || 0;
            targetPitch = targetScene.initialView.pitch || 0;
            targetFov = targetScene.initialView.fov || 75;
            currentYaw = targetYaw;
            currentPitch = targetPitch;
            currentFov = targetFov;
          }

          setTimeout(() => {
            if (transitionOverlay) transitionOverlay.classList.remove('active');
          }, 150);
        } catch (finishErr) {
          console.error('[Virtual Tour] Error applying scene texture to sphere:', finishErr);
          window.showViewerErrorUI('Rendering Error', 'Failed to render panorama on 3D sphere.', finishErr.message);
        }
      };

      if (textureCache.has(targetScene.url)) {
        finishLoad(textureCache.get(targetScene.url));
      } else {
        loadPanoramaTexture(
          targetScene,
          (tex) => {
            textureCache.set(targetScene.url, tex);
            finishLoad(tex);
          },
          (err, resolvedUrl) => {
            if (transitionOverlay) transitionOverlay.classList.remove('active');
            window.showViewerErrorUI(
              'Unable to Load Panorama',
              'Failed to load image for scene "' + targetScene.title + '".',
              'Attempted path: ' + targetScene.url + '\nResolved URL: ' + resolvedUrl + '\n\nPlease verify that the file exists in the "panoramas" directory.'
            );
          }
        );
      }
    }

    function updateRoomsDrawer() {
      if (!roomsListEl) return;
      roomsListEl.innerHTML = '';
      tourData.scenes.forEach((s, idx) => {
        const isActive = s.id === currentSceneId;
        const card = document.createElement('div');
        card.className = 'room-card' + (isActive ? ' active' : '');
        const thumbUrl = window.getAbsoluteAssetUrl(s.thumbUrl || s.url);
        card.innerHTML = `
          <img src="${escapeHtml(thumbUrl)}" class="room-thumb" alt="${escapeHtml(s.title || 'Scene')}" loading="lazy">
          <div class="room-name">${idx + 1}. ${escapeHtml(s.title || 'Scene')}</div>
        `;
        card.onclick = () => {
          loadScene(s.id);
          roomsDrawerEl.classList.remove('open');
        };
        roomsListEl.appendChild(card);
      });
    }

    // Pointer & Touch Drag Interactions
    let activePointerType = 'mouse';
    let initialPinchFov = config.fov;

    function onPointerDown(e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      isPointerDown = true;
      activePointerType = e.pointerType || 'mouse';
      pointerStartX = e.clientX;
      pointerStartY = e.clientY;
      previousPointerX = e.clientX;
      previousPointerY = e.clientY;
      pointerStartTime = Date.now();
      lastInteractionTime = Date.now();

      if (e.pointerId && container.setPointerCapture) {
        try {
          container.setPointerCapture(e.pointerId);
        } catch (err) {}
      }
    }

    function onPointerMove(e) {
      if (!isPointerDown || isPinching) {
        if (!isPointerDown) checkHover(e.clientX, e.clientY);
        return;
      }
      const deltaX = e.clientX - previousPointerX;
      const deltaY = e.clientY - previousPointerY;
      previousPointerX = e.clientX;
      previousPointerY = e.clientY;

      const isTouch = activePointerType === 'touch' || e.pointerType === 'touch';
      // Touch sensitivity: 2.2x multiplier makes mobile finger swipes responsive and natural.
      // Desktop mouse sensitivity: preserved at 1.0x desktop precision.
      const touchSens = (config.touchSensitivity || 1.0) * 2.2;
      const mouseSens = (config.mouseSensitivity || 1.0);
      const sensitivity = isTouch ? touchSens : mouseSens;

      const aspect = camera.aspect || (width / height);
      const hFov = currentFov * Math.max(1, aspect);

      targetYaw -= (deltaX / width) * hFov * sensitivity;
      targetPitch += (deltaY / height) * currentFov * sensitivity;
      targetPitch = Math.max(config.pitchLimits[0], Math.min(config.pitchLimits[1], targetPitch));
      lastInteractionTime = Date.now();
    }

    function onPointerUp(e) {
      if (e && e.pointerId && container.releasePointerCapture) {
        try {
          container.releasePointerCapture(e.pointerId);
        } catch (err) {}
      }
      if (!isPointerDown) return;
      isPointerDown = false;
      const dist = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);
      if (dist < 20 && Date.now() - pointerStartTime < 500) {
        handleClick(e.clientX, e.clientY);
      }
    }

    function checkHover(clientX, clientY) {
      mouse.x = (clientX / width) * 2 - 1;
      mouse.y = -(clientY / height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(Array.from(hotspotObjects.keys()));
      container.style.cursor = hits.length > 0 ? 'pointer' : 'grab';
    }

    function handleClick(clientX, clientY) {
      mouse.x = (clientX / width) * 2 - 1;
      mouse.y = -(clientY / height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(Array.from(hotspotObjects.keys()));
      if (hits.length > 0) {
        const hs = hotspotObjects.get(hits[0].object);
        if (!hs) return;
        if (hs.type === 'nav' && hs.targetSceneId) {
          loadScene(hs.targetSceneId);
        } else {
          hotspotModalTitle.textContent = hs.title || 'Information Hotspot';
          hotspotModalDesc.textContent = hs.description || 'No additional details available.';
          hotspotModal.style.display = 'block';
        }
      }
    }

    // Touch & Multi-Touch Gestures
    container.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    container.addEventListener('touchstart', (e) => {
      if (e.touches.length >= 2) {
        isPinching = true;
        isPointerDown = false;
        touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialPinchFov = currentFov;
      }
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
      if (e.touches.length >= 2 && isPinching) {
        e.preventDefault();
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (touchStartDist > 0 && currentDist > 0) {
          const pinchRatio = touchStartDist / currentDist;
          targetFov = Math.max(config.minFov, Math.min(config.maxFov, initialPinchFov * pinchRatio));
          lastInteractionTime = Date.now();
        }
      } else if (e.touches.length === 1 && !isPinching) {
        // Prevent outer page scrolling while swiping over the 360 viewer canvas
        e.preventDefault();
      }
    }, { passive: false });

    container.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        isPinching = false;
      }
    });
    container.addEventListener('touchcancel', () => {
      isPinching = false;
    });

    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetFov = Math.max(config.minFov, Math.min(config.maxFov, targetFov + (e.deltaY > 0 ? 4 : -4)));
      lastInteractionTime = Date.now();
    }, { passive: false });

    // UI Bindings
    if (btnRooms) btnRooms.onclick = () => roomsDrawerEl.classList.toggle('open');
    if (btnCloseDrawer) btnCloseDrawer.onclick = () => roomsDrawerEl.classList.remove('open');
    if (btnCloseModal) btnCloseModal.onclick = () => hotspotModal.style.display = 'none';

    if (btnFullscreen) {
      btnFullscreen.onclick = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      };
    }

    if (btnBrightness) {
      btnBrightness.onclick = () => {
        brightnessPopover.style.display = brightnessPopover.style.display === 'flex' ? 'none' : 'flex';
        btnBrightness.classList.toggle('active');
      };
    }
    if (exposureSlider) {
      exposureSlider.oninput = (e) => {
        config.exposure = parseFloat(e.target.value);
        applyExposure();
      };
    }
    if (btnResetExposure) {
      btnResetExposure.onclick = () => {
        config.exposure = 1.0;
        applyExposure();
      };
    }

    if (btnRotate) {
      btnRotate.onclick = () => {
        config.autoRotate = !config.autoRotate;
        btnRotate.classList.toggle('active', config.autoRotate);
      };
    }

    if (btnZoomIn) {
      btnZoomIn.onclick = () => {
        targetFov = Math.max(config.minFov, targetFov - 10);
        lastInteractionTime = Date.now();
      };
    }
    if (btnZoomOut) {
      btnZoomOut.onclick = () => {
        targetFov = Math.min(config.maxFov, targetFov + 10);
        lastInteractionTime = Date.now();
      };
    }

    if (btnErrorRetry) {
      btnErrorRetry.onclick = () => {
        window.hideViewerErrorUI();
        loadScene(currentSceneId, true);
      };
    }
    if (btnErrorDismiss) {
      btnErrorDismiss.onclick = () => {
        window.hideViewerErrorUI();
      };
    }

    // Responsive Canvas & Dimension Sizing
    function updateDimensions() {
      const rect = container.getBoundingClientRect();
      width = Math.max(1, rect.width || container.clientWidth || window.innerWidth);
      height = Math.max(1, rect.height || container.clientHeight || window.innerHeight);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      if (renderer) {
        renderer.setSize(width, height, false);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      }
    }

    window.addEventListener('resize', updateDimensions);
    window.addEventListener('orientationchange', () => {
      setTimeout(updateDimensions, 100);
      setTimeout(updateDimensions, 300);
    });

    if (window.ResizeObserver) {
      const resizeObserver = new ResizeObserver(() => {
        updateDimensions();
      });
      resizeObserver.observe(container);
    }

    // Render Loop
    let lastTime = performance.now();
    function animate(time) {
      requestAnimationFrame(animate);
      const delta = (time - lastTime) / 1000;
      lastTime = time;

      // Auto-rotation
      if (config.autoRotate && !isPointerDown && (Date.now() - lastInteractionTime > 3000)) {
        targetYaw += config.autoRotateSpeed * delta * 4;
      }

      // Smooth inertia damping
      currentYaw += (targetYaw - currentYaw) * 0.1;
      currentPitch += (targetPitch - currentPitch) * 0.1;
      currentFov += (targetFov - currentFov) * 0.1;

      camera.fov = currentFov;
      camera.updateProjectionMatrix();

      const phi = THREE.MathUtils.degToRad(90 - currentPitch);
      const theta = THREE.MathUtils.degToRad(currentYaw + 180);
      const target = new THREE.Vector3(
        500 * Math.sin(phi) * Math.cos(theta),
        500 * Math.cos(phi),
        500 * Math.sin(phi) * Math.sin(theta)
      );
      camera.lookAt(target);

      // Pulse portal halo rings
      const pulse = 1 + Math.sin(time * 0.005) * 0.12;
      for (const mesh of pulsingMeshes) {
        mesh.scale.set(pulse, pulse, pulse);
      }

      // Update Compass Needle
      if (compassNeedle) {
        compassNeedle.style.transform = 'rotate(' + (-currentYaw) + 'deg)';
      }

      if (renderer) {
        renderer.render(scene, camera);
      }
    }

    // Start Viewer
    loadScene(currentSceneId, false);
    applyExposure();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
